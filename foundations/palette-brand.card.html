<!-- @dsCard group="Colors" viewport="700x180" name="Brand — violet & royal" subtitle="Action (violet) and Data (royal) role families" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--ht-bg);font-family:var(--ht-font-sans)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sw{border:1px solid var(--ht-hairline);border-radius:8px;overflow:hidden;background:#fff}
.sw .c{height:52px}.sw .m{padding:7px 10px;font-size:11px;color:var(--ht-text-muted)}
.sw .m b{display:block;font-size:12px;color:var(--ht-text-head);font-weight:500}
.lbl{font-size:10.5px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--ht-text-muted);margin:0 0 8px}</style></head>
<body>
<p class="lbl">Action · violet</p>
<div class="grid" style="margin-bottom:12px">
<div class="sw"><div class="c" style="background:var(--ht-action)"></div><div class="m"><b>--ht-action</b>#4C1EA8</div></div>
<div class="sw"><div class="c" style="background:var(--ht-action-hover)"></div><div class="m"><b>--ht-action-hover</b>#3B1683</div></div>
<div class="sw"><div class="c" style="background:var(--ht-action-tint)"></div><div class="m"><b>--ht-action-tint</b>primary @ 8%</div></div>
<div class="sw"><div class="c" style="background:var(--ht-action-select)"></div><div class="m"><b>--ht-action-select</b>primary @ 14%</div></div>
</div>
<p class="lbl">Data · royal</p>
<div class="grid">
<div class="sw"><div class="c" style="background:var(--ht-data)"></div><div class="m"><b>--ht-data</b>#4860FC</div></div>
<div class="sw"><div class="c" style="background:var(--ht-data-text)"></div><div class="m"><b>--ht-data-text</b>#2C3ECF</div></div>
<div class="sw"><div class="c" style="background:var(--ht-data-tint)"></div><div class="m"><b>--ht-data-tint</b>#EEF0FE</div></div>
<div class="sw"><div class="c" style="background:var(--ht-data-mid)"></div><div class="m"><b>--ht-data-mid</b>#DDE2FD</div></div>
</div>
</body></html>
