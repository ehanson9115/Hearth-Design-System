<!-- @dsCard group="Colors" viewport="700x150" name="Grey ladder" subtitle="Violet-cast neutrals, grey-0 → grey-5" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--ht-bg);font-family:var(--ht-font-sans)}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.sw{border:1px solid var(--ht-hairline);border-radius:8px;overflow:hidden;background:#fff}
.sw .c{height:58px}.sw .m{padding:7px 9px;font-size:10.5px;color:var(--ht-text-muted)}
.sw .m b{display:block;font-size:11.5px;color:var(--ht-text-head);font-weight:500}
.use{font-size:10px;color:var(--ht-text-subtle);margin-top:2px}</style></head>
<body>
<div class="grid">
<div class="sw"><div class="c" style="background:var(--ht-grey-0)"></div><div class="m"><b>grey-0</b>#FFFFFF<div class="use">card</div></div></div>
<div class="sw"><div class="c" style="background:var(--ht-grey-1)"></div><div class="m"><b>grey-1</b>#FAFAFC<div class="use">header/input</div></div></div>
<div class="sw"><div class="c" style="background:var(--ht-grey-2)"></div><div class="m"><b>grey-2</b>#F5F5F9<div class="use">sidebar</div></div></div>
<div class="sw"><div class="c" style="background:var(--ht-grey-3)"></div><div class="m"><b>grey-3</b>#ECECF2<div class="use">divider</div></div></div>
<div class="sw"><div class="c" style="background:var(--ht-grey-4)"></div><div class="m"><b>grey-4</b>#E4E4EC<div class="use">hairline</div></div></div>
<div class="sw"><div class="c" style="background:var(--ht-grey-5)"></div><div class="m"><b>grey-5</b>#DBDAE5<div class="use">pressed</div></div></div>
</div>
</body></html>
