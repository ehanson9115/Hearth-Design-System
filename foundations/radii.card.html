<!-- @dsCard group="Spacing" viewport="760x170" name="Corner radii" subtitle="6 input · 8 card/button · 12 editorial" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--ht-bg);font-family:var(--ht-font-sans)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.r{text-align:center}
.r .box{height:66px;background:#fff;border:1px solid var(--ht-border)}
.r .nm{font-size:12px;color:var(--ht-text-head);font-weight:500;margin-top:8px}
.r .use{font-size:11px;color:var(--ht-text-muted);margin-top:1px}</style></head>
<body>
<div class="grid">
<div class="r"><div class="box" style="border-radius:var(--ht-r-chip)"></div><div class="nm">4px · --ht-r-chip</div><div class="use">status chips</div></div>
<div class="r"><div class="box" style="border-radius:var(--ht-r-input)"></div><div class="nm">6px · --ht-r-input</div><div class="use">controls, option cards, alerts</div></div>
<div class="r"><div class="box" style="border-radius:var(--ht-r-card)"></div><div class="nm">8px · --ht-r-card</div><div class="use">cards, panels, buttons</div></div>
<div class="r"><div class="box" style="border-radius:var(--ht-r-block)"></div><div class="nm">12px · --ht-r-block</div><div class="use">editorial, highlight card</div></div>
</div>
</body></html>
