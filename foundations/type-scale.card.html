<!-- @dsCard group="Type" viewport="700x260" name="Type scale" subtitle="Geist · one scale from greeting to micro" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px 22px;background:var(--ht-bg);font-family:var(--ht-font-sans)}
.trow{display:flex;align-items:baseline;gap:16px;padding:5px 0}
.tm{font-size:11.5px;color:var(--ht-text-muted);min-width:96px;font-variant-numeric:tabular-nums}</style></head>
<body>
<div class="trow"><span class="tm">28 / 500</span><span style="font-size:28px;font-weight:500;letter-spacing:-0.015em;color:var(--ht-text-head)">Dashboard greeting</span></div>
<div class="trow"><span class="tm">22 / 500</span><span style="font-size:22px;font-weight:500;letter-spacing:-0.005em;color:var(--ht-text-head)">Hero on dark (optical)</span></div>
<div class="trow"><span class="tm">20 / 500</span><span style="font-size:20px;font-weight:500;letter-spacing:-0.01em;color:var(--ht-text-head)">Page / step title</span></div>
<div class="trow"><span class="tm">15 / 500</span><span style="font-size:15px;font-weight:500;color:var(--ht-text-head)">Card headline</span></div>
<div class="trow"><span class="tm">14.5 / 500</span><span style="font-size:14.5px;font-weight:500;color:var(--ht-text-head)">Label / button</span></div>
<div class="trow"><span class="tm">14 / 400</span><span style="font-size:14px;color:var(--ht-text)">Body and subcopy text</span></div>
<div class="trow"><span class="tm">12.5 / 400</span><span style="font-size:12.5px;color:var(--ht-text-muted)">Card subtitle / hint</span></div>
<div class="trow"><span class="tm">10.5 / 500</span><span style="font-size:10.5px;font-weight:500;letter-spacing:0.07em;color:var(--ht-text-muted)">SUB-SECTION CAPS (INSIDE CARDS ONLY)</span></div>
</body></html>
