<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;background:var(--ht-bg)}.grp{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.grp:last-child{margin-bottom:0}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Button, IncomeButton, Badge, Avatar, Pill, SegmentedControl, ProgressBar, Eyebrow, ProgramTag, IconTile } = window.Hearth_5938e8;
function Demo(){
  const [seg,setSeg] = React.useState('Yes');
  const [view,setView] = React.useState('Transactions');
  const [tab,setTab] = React.useState('Home');
  return (<>
    <div className="grp">
      <Button variant="primary" icon="ti-calendar-plus">Book appointment</Button>
      <Button variant="secondary">View details</Button>
      <Button variant="tint">Save for later</Button>
      <Button variant="primary" size="sm">Copy notes</Button>
      <Button variant="primary" disabled>Disabled</Button>
      <Button variant="link" href="#">Learn what's covered</Button>
    </div>
    <div className="grp">
      <IncomeButton provider="truv" />
      <IncomeButton provider="argyle" />
    </div>
    <div className="grp">
      <Badge variant="success">Approved</Badge>
      <Badge variant="warning">Pending review</Badge>
      <Badge variant="danger">Over income limit</Badge>
      <Badge variant="info">In progress</Badge>
      <Badge variant="brand">High relevance</Badge>
      <Badge variant="neutral">Standard</Badge>
      <Badge variant="outline">60+ / Disabled</Badge>
    </div>
    <div className="grp">
      <Badge variant="success" chip>OCR: High confidence</Badge>
      <Badge variant="success" chip check>Match confirmed</Badge>
      <Badge variant="warning" chip>Low confidence</Badge>
      <Badge variant="info" chip>SSA eCBSV</Badge>
    </div>
    <div className="grp">
      {['Home','Appointments','Benefits','Messages'].map(t=>
        <Pill key={t} active={tab===t} onClick={()=>setTab(t)}>{t}</Pill>)}
      <Avatar name="Maria Alvarez" />
      <Avatar name="Jordan Chen" size="lg" />
      <ProgramTag>WIC</ProgramTag>
      <ProgramTag>SNAP</ProgramTag>
    </div>
    <div className="grp">
      <IconTile icon="ti-stethoscope" />
      <IconTile icon="ti-chart-bar" tone="data" />
      <IconTile icon="ti-alert-triangle" tone="warning" />
      <IconTile icon="ti-building" size={40} />
      <IconTile icon="ti-heart-handshake" tone="data" circle size={40} />
      <IconTile icon="ti-check" tone="success" solid circle size={44} />
    </div>
    <div className="grp" style={{gap:24}}>
      <Eyebrow>Your benefits</Eyebrow>
      <Eyebrow level="card">Recent activity</Eyebrow>
      <SegmentedControl value={seg} onChange={setSeg} options={['Yes','No','Unsure']} />
      <div style={{maxWidth:380,width:'100%'}}>
        <SegmentedControl fullWidth size="md" value={view} onChange={setView} options={['Transactions','Payouts']} />
      </div>
    </div>
    <div className="grp" style={{display:'block',maxWidth:380}}>
      <ProgressBar value={62} step={3} of={5} label="About your household" />
    </div>
  </>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
