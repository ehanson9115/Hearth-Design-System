<!-- @dsCard group="Components" viewport="700x840" name="Data — table, activity, transcript, notices" subtitle="Data table with status cells · activity feed · live transcript · notice history timeline" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;background:var(--ht-bg)}.cols{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { DataTable, DataTableName, ActivityList, Transcript, Panel, PanelBody, Badge, NoticeTimeline } = window.Hearth_5938e8;
const rows=[
 {id:'2026-499-929',name:'Bob Stoops',status:'Pending review',tone:'warning',who:'J. Chen',when:'2:04 PM'},
 {id:'2026-499-871',name:'Maria Alvarez',status:'In progress',tone:'info',who:'J. Chen',when:'1:38 PM'},
 {id:'2026-499-702',name:'Sam Ortiz',status:'Approved',tone:'success',who:'R. Patel',when:'11:20 AM'},
];
ReactDOM.createRoot(document.getElementById('root')).render(
  <div className="cols">
    <div style={{display:'flex',flexDirection:'column',gap:16}}>
      <Panel title="Residents" icon="ti-users" subtitle="3 of 32 open cases">
        <DataTable rowKey="id" rows={rows} columns={[
          {key:'r',header:'Resident',render:r=><DataTableName sub={r.id}>{r.name}</DataTableName>},
          {key:'s',header:'Status',render:r=><Badge variant={r.tone}>{r.status}</Badge>},
          {key:'who',header:'Assigned'},
          {key:'when',header:'Updated',align:'right'},
        ]}/>
      </Panel>
      <Panel band live title="Live transcript" meta="73 messages">
        <Transcript messages={[
          {speaker:'Caseworker',worker:true,time:'1:53 PM',text:'And what do you pay in rent or mortgage each month?'},
          {speaker:'Applicant',time:'1:55 PM',text:"It's about $2,350 all in — mortgage, taxes, insurance.",flag:{text:'High shelter costs — check deduction',action:'Add note'}},
          {speaker:'Caseworker',worker:true,time:'1:56 PM',text:'Thanks — that may qualify you for a deduction.'},
        ]}/>
      </Panel>
    </div>
    <div style={{display:'flex',flexDirection:'column',gap:16}}>
    <Panel title="Recent activity" icon="ti-activity" subtitle="Last updated 2 minutes ago">
      <PanelBody>
        <ActivityList items={[
          {name:'Bob Stoops',text:'interview completed',when:'2:04 PM',badge:<Badge variant="warning">Pending</Badge>},
          {name:'Maria Alvarez',text:'uploaded proof of address',when:'1:38 PM'},
          {name:'Sam Ortiz',text:'approved, notice sent',when:'11:20 AM'},
        ]}/>
      </PanelBody>
    </Panel>
    <NoticeTimeline items={[
      {title:'Eligibility approved',when:'Mar 14 at 09:30 AM',channel:'Email',
       body:'Your application for Medicaid and SNAP has been approved. Benefits begin April 1, 2026.'},
      {title:'Renewal due soon',when:'Mar 9 at 02:15 PM',channel:'Portal',
       body:'Your Medicaid coverage expires May 31, 2026. Renew by May 15 to avoid a gap in coverage.'},
      {title:'Change report received',when:'Mar 4 at 11:45 AM',channel:'SMS',
       body:'We received your report about your new job. We are reviewing it and will contact you if we need more details.'},
    ]}/>
    </div>
  </div>
);
</script>
</body>
</html>
