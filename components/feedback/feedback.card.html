<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;background:var(--ht-bg)}.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}.stack{display:flex;flex-direction:column;gap:10px}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { NotificationCard, AnnouncementBar, StatusCard, Skeleton, Button, Toast, ConfirmDialog, SuccessHero } = window.Hearth_5938e8;
ReactDOM.createRoot(document.getElementById('root')).render(
  <div className="stack">
    <AnnouncementBar action="See how it works" onDismiss={()=>{}}>New: excess shelter deductions are now flagged automatically.</AnnouncementBar>
    <div className="cols">
      <div className="stack">
        <NotificationCard variant="info" title="Your renewal is coming up">Renew by August 15 to keep your coverage.</NotificationCard>
        <NotificationCard variant="success" title="Application submitted">We'll send you a message within 3 business days.</NotificationCard>
        <NotificationCard variant="warning" title="One document still needed">Upload proof of address to finish.</NotificationCard>
        <NotificationCard variant="danger" compact title="Over income limit">Gross $4,000/mo vs. $3,380/mo threshold.</NotificationCard>
        <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
          <Toast>Document uploaded</Toast>
          <Toast check={false}>Saved</Toast>
        </div>
      </div>
      <div className="stack">
        <StatusCard variant="success" title="Application submitted">We sent a copy to your email. You don't need to do anything else today.</StatusCard>
        <StatusCard variant="loading" title="Checking what you qualify for">This takes about 10 seconds. Don't close the app.</StatusCard>
        <StatusCard variant="empty" icon="ti-calendar" title="No appointments yet"
          action={<Button variant="primary">Book appointment</Button>}>When you book one, it will show up here.</StatusCard>
        <Skeleton rows={3} />
      </div>
    </div>
    <div className="cols">
      <ConfirmDialog inline tone="danger" title="Deny this application?" confirmLabel="Deny application">
        Bob Stoops will be notified today and the case closes. Reopening requires a supervisor.
      </ConfirmDialog>
      <ConfirmDialog inline tone="default" title="Send the interview invite?" confirmLabel="Send invite">
        Maria Alvarez gets a text and an email with the 2:15p slot on July 24.
      </ConfirmDialog>
    </div>
    <div className="cols" style={{background:'var(--ht-surface)',borderRadius:'var(--ht-r-card)',boxShadow:'inset 0 0 0 1px var(--ht-hairline)',padding:'32px 20px'}}>
      <SuccessHero tone="success" title="Application submitted"
        description="We'll text (406) 555-0134 within 3 business days about your WIC appointment.">
        <Button variant="secondary">Back to home</Button>
      </SuccessHero>
      <SuccessHero tone="accent" icon="ti ti-send" title="Interview invite sent"
        description="Maria Alvarez received a text and an email with the 2:15p slot on July 24." />
    </div>
  </div>
);
</script>
</body>
</html>
