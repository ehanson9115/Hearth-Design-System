<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="styles.css">
<style>
  html,body{margin:0}
  .tile{width:1280px;height:854px;background:var(--ht-primary);display:flex;align-items:center;justify-content:center;gap:44px;font-family:var(--ht-font-sans)}
  .chip{width:190px;height:190px;border-radius:44px;background:#fff;display:grid;place-content:center;flex-shrink:0}
  .chip svg{width:112px;height:112px;display:block}
  .name{color:#fff;font-size:200px;font-weight:500;letter-spacing:-0.035em;line-height:1}
</style>
</head>
<body>
<div class="tile">
  <div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="var(--ht-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.5 12.572 12 20l-7.5-7.428A5 5 0 1 1 12 6.006a5 5 0 1 1 7.5 6.566"></path></svg></div>
  <div class="name">Hearth</div>
</div>
</body>
</html>
